<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Tool</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f5f7; }
    header { background: #222; color: white; padding: 16px 24px;
              display: flex; justify-content: space-between; align-items: center; }
    header a, header button { color: white; margin-left: 12px; text-decoration: none; }
    header button { background: none; border: 1px solid white; padding: 6px 12px; cursor: pointer; }
    .wrap { max-width: 700px; margin: 24px auto; padding: 0 16px; }
    .new-project { background: white; border-radius: 8px; padding: 16px; margin-bottom: 20px; }
    .new-project input, .new-project textarea { width: 100%; box-sizing: border-box;
      padding: 8px; margin: 6px 0; }
    .new-project button { padding: 8px 16px; background: #222; color: white; border: 0;
      border-radius: 4px; cursor: pointer; }
    .project-card { background: white; border-radius: 8px; padding: 16px; margin-bottom: 12px;
      display: flex; justify-content: space-between; align-items: center; }
    .project-card a { text-decoration: none; color: #222; font-weight: bold; font-size: 18px; }
    .project-card .meta { color: #666; font-size: 13px; margin-top: 4px; }
    .role-badge { font-size: 11px; text-transform: uppercase; background: #eee;
      padding: 3px 8px; border-radius: 10px; color: #555; }
  </style>
</head>
<body>
  <header>
    <h1>Project Tool</h1>
    <div id="user-area"></div>
  </header>

  <div class="wrap">
    <div class="new-project" id="new-project" style="display:none;">
      <h3>New project</h3>
      <input type="text" id="proj-name" placeholder="Project name">
      <textarea id="proj-desc" rows="2" placeholder="Description (optional)"></textarea>
      <button id="create-btn">Create</button>
    </div>
    <div id="projects">Loading...</div>
  </div>

  <script>
    async function checkUser() {
      const response = await fetch('/api/me');
      const me = await response.json();
      const area = document.getElementById('user-area');

      if (me) {
        area.innerHTML = `<span>${me.name}</span>`;
        const logout = document.createElement('button');
        logout.textContent = 'Log out';
        logout.onclick = async () => {
          await fetch('/api/logout', { method: 'POST' });
          window.location.reload();
        };
        area.appendChild(logout);
        document.getElementById('new-project').style.display = 'block';
      } else {
        area.innerHTML = '<a href="/account.html">Log in / Register</a>';
      }
      return me;
    }

    async function loadProjects() {
      const response = await fetch('/api/projects');
      if (!response.ok) {
        document.getElementById('projects').innerHTML = '<p>Log in to see your projects.</p>';
        return;
      }
      const projects = await response.json();
      const container = document.getElementById('projects');

      container.innerHTML = projects.length
        ? projects.map(p => `
            <div class="project-card">
              <div>
                <a href="/board.html?id=${p.id}">${escapeHtml(p.name)}</a>
                <div class="meta">${p.task_count} task${p.task_count === 1 ? '' : 's'}</div>
              </div>
              <span class="role-badge">${p.role}</span>
            </div>`).join('')
        : '<p>No projects yet — create one above.</p>';
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    document.getElementById('create-btn').onclick = async () => {
      const name = document.getElementById('proj-name').value;
      const description = document.getElementById('proj-desc').value;
      if (!name.trim()) return;

      const response = await fetch('/api/projects', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, description })
      });
      const result = await response.json();
      window.location.href = '/board.html?id=' + result.id; // jump straight into the new board
    };

    checkUser().then(loadProjects);
  </script>
</body>
</html>
